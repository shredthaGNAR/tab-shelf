name: Website

# Builds the Astro site in site/ and deploys it to GitHub Pages.
# The extension is packaged in the same run so the site can offer the
# latest build as a download (tab-shelf.xpi).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Package the extension
        run: |
          npm ci
          npm run build
          cp dist/tab_shelf-*.zip site/public/tab-shelf.xpi

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
